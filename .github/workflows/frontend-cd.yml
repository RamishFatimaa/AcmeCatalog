name: Frontend CD

on:
  push:
    branches: [stage]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-cd.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and deploy
        uses: Azure/static-web-apps-deploy@v1
        env:
          # Build-time only — baked into the static bundle, same as any
          # other Vite VITE_* var. The real deployed service URLs, not
          # local dev's.
          VITE_IDENTITY_SERVICE_URL: https://identity-service.gentleocean-dbe03ff8.eastus.azurecontainerapps.io
          VITE_CATALOG_SERVICE_URL: https://catalog-service.gentleocean-dbe03ff8.eastus.azurecontainerapps.io
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: 'upload'
          app_location: 'frontend'
          output_location: 'dist'
          skip_app_build: false
