name: CI

# The single system-level orchestration workflow — every quality-gate job
# stays in this one file/one github.run_id on purpose, per an explicit
# decision to keep timing/dashboard data deterministic rather than have
# push-job-timing.mjs try to reassemble state across independent workflow
# runs (real race conditions, rerun ambiguity, and PR merge-SHA problems
# that way — rejected for exactly those reasons). Shared implementations
# live in the reusable-*.yml workflows and .github/actions/* composite
# actions this file calls; this file itself stays a thin sequence of
# `needs:` edges expressing the actual gate order.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  METRICS_STORAGE_ACCOUNT: acmecatalogmetrics

jobs:
  # Stage 1
  unit-tests:
    permissions:
      contents: read
      checks: write
      id-token: write
    uses: ./.github/workflows/reusable-dotnet-tests.yml
    with:
      test-filter: Unit
      job-display-name: backend-unit-tests
    secrets: inherit

  # Stage 2 — component, integration, and both consumer Pact jobs all run
  # in parallel once unit-tests passes; none of the four has a real
  # technical dependency on any other.
  component-tests:
    needs: unit-tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install npm dependencies
        working-directory: frontend
        run: npm ci

      # No backend involved at all — components mount in isolation with the
      # app's real CSS (see cypress/support/component.ts).
      - name: Run Component Tests
        uses: cypress-io/github-action@v6
        with:
          working-directory: frontend
          install: false
          component: true
          record: true
        env:
          COMMIT_INFO_MESSAGE: ${{ github.event.head_commit.message }}
          CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}

      - name: Upload Cypress evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: component-tests
          path: |
            frontend/cypress/screenshots
            frontend/cypress/videos
            frontend/cypress/results
          if-no-files-found: ignore

      - name: Publish test metrics
        if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: ./.github/actions/publish-test-metrics
        with:
          mode: cypress
          results-path: ../../frontend/cypress/results
          job-name: component-tests
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

  integration-tests:
    needs: unit-tests
    permissions:
      contents: read
      checks: write
      id-token: write
    uses: ./.github/workflows/reusable-dotnet-tests.yml
    with:
      test-filter: Integration
      job-display-name: backend-integration-tests
    secrets: inherit

  # catalog-service is the Pact CONSUMER here — it knows what it requires
  # from identity-service and owns publishing that expectation.
  pact-consumer-catalog:
    needs: unit-tests
    permissions:
      contents: read
      checks: write
      id-token: write
    uses: ./.github/workflows/reusable-pact-consumer-dotnet.yml
    with:
      test-project: tests/CatalogService.Tests/CatalogService.Tests.csproj
      pacticipant: catalog-service
      provider: identity-service
      pact-file-path: pacts/catalog-service-identity-service.json
      # Real PR head identity, never the synthetic merge SHA/ref a bare
      # github.sha/github.ref_name would read on a pull_request event.
      version-sha: ${{ github.event.pull_request.head.sha || github.sha }}
      branch-name: ${{ github.head_ref || github.ref_name }}
      metrics-job-name: pact-consumer-catalog
    secrets: inherit

  # frontend is the other Pact CONSUMER — same ownership reasoning.
  pact-consumer-frontend:
    needs: unit-tests
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/reusable-pact-consumer-node.yml
    with:
      pacticipant: frontend
      provider: identity-service
      pact-file-path: pacts/frontend-identity-service.json
      version-sha: ${{ github.event.pull_request.head.sha || github.sha }}
      branch-name: ${{ github.head_ref || github.ref_name }}
      metrics-job-name: pact-consumer-frontend
    secrets: inherit

  # Stage 3 — identity-service is the Pact PROVIDER for both consumers
  # above; WithPactBrokerSource has no consumer filter, so this one job
  # dynamically fetches and verifies every relevant contract rather than
  # needing one hard-coded job per consumer. Waits for both because
  # verifying against a pact that hasn't been published yet would just be
  # verifying stale state.
  pact-provider-verify:
    needs: [pact-consumer-catalog, pact-consumer-frontend]
    permissions:
      contents: read
      checks: write
      id-token: write
    uses: ./.github/workflows/reusable-pact-provider.yml
    with:
      version-sha: ${{ github.event.pull_request.head.sha || github.sha }}
      branch-name: ${{ github.head_ref || github.ref_name }}
      metrics-job-name: pact-provider-verify
    secrets: inherit

  # Stage 4 — the system-level E2E smoke suite starts the fully integrated
  # app (identity + catalog + frontend) and needs every middle-layer gate
  # to have already passed: component and integration tests prove each
  # piece works in isolation, provider verification proves the real
  # inter-service contract holds, before spending the time booting all
  # three together for real.
  e2e-smoke:
    needs: [component-tests, integration-tests, pact-provider-verify]
    strategy:
      fail-fast: false
      matrix:
        # Every spec in this repo has only ever run in Cypress's bundled
        # Electron. Firefox goes on smoke only (not regression, which
        # already triples the container count) as a real-browser sanity
        # check, not a second full suite copy.
        browser: [electron]
        containers: [1, 2]
        include:
          - browser: firefox
            containers: 1
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/reusable-cypress-e2e.yml
    with:
      # ci-build-id groups matrix workers into one Cypress Cloud run so it
      # can load-balance spec files across them. Both Electron workers
      # share this exact string (matrix.containers isn't part of it);
      # Firefox's browser value makes its string different on purpose, so
      # it never joins the Electron group. run_attempt is included so a
      # manual re-run of this workflow can't collide with the original
      # attempt's build id.
      cypress-command: npm run e2e:smoke -- --record --parallel --ci-build-id ${{ github.run_id }}-${{ github.run_attempt }}-smoke-${{ matrix.browser }} --group e2e-smoke-${{ matrix.browser }}
      browser: ${{ matrix.browser }}
      artifact-name: e2e-smoke-${{ matrix.browser }}-${{ matrix.containers }}
      metrics-job-name: e2e-smoke
      metrics-matrix-index: ${{ matrix.browser }}-${{ matrix.containers }}
    secrets: inherit

  # Stage 5 — regression only after smoke passes, and only on stage: it's
  # the full suite, not a sanity check, and not worth the time on every
  # push/PR.
  e2e-regression:
    needs: e2e-smoke
    # A custom `if:` on a job with `needs:` REPLACES GitHub's implicit
    # success()-of-all-needs check, it doesn't add to it — found by
    # deliberately checking this rather than assuming. Without success()
    # here, this job would run on every push to stage regardless of
    # whether e2e-smoke failed, silently violating "smoke failure ->
    # regression does not start."
    if: success() && github.ref == 'refs/heads/stage'
    strategy:
      fail-fast: false
      matrix:
        containers: [1, 2, 3]
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/reusable-cypress-e2e.yml
    with:
      # All three containers share this exact string (matrix.containers
      # isn't part of it) so Cypress Cloud treats them as one parallel run.
      cypress-command: npm run e2e:regression -- --record --parallel --ci-build-id ${{ github.run_id }}-${{ github.run_attempt }}-regression --group e2e-regression
      artifact-name: e2e-regression-${{ matrix.containers }}
      metrics-job-name: e2e-regression
      metrics-matrix-index: ${{ matrix.containers }}
    secrets: inherit

  # Intentionally non-gating (continue-on-error) and intentionally absent
  # from every needs: list below — must never be required by service
  # validation, E2E, CD, timing, or dashboard publication.
  ai-prompt-demo:
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build backend
        run: dotnet build AcmeCatalog.slnx --configuration Release

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Start identity-service
        uses: ./.github/actions/start-dotnet-service
        with:
          project-path: services/identity-service
          url: http://localhost:5301
          log-name: identity.log

      - name: Start catalog-service
        uses: ./.github/actions/start-dotnet-service
        with:
          project-path: services/catalog-service
          url: http://localhost:5302
          log-name: catalog.log
          extra-env: Services__IdentityServiceBaseUrl=http://localhost:5301

      - name: Run cy.prompt() demo
        uses: cypress-io/github-action@v6
        with:
          working-directory: frontend
          install: false
          start: npm run dev
          wait-on: 'http://localhost:5173'
          wait-on-timeout: 90
          command: npm run e2e:ai-demo
        env:
          CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}

  # Stage 6 — sourced from the GitHub Actions API itself for this exact
  # github.run_id, which is what gives record-job-timing (and the
  # dashboard's critical-path view) an exact, deterministic relationship
  # between every job/step in the run above. Deliberately does not search
  # other workflow runs. !cancelled() (not just always()) so a cancelled
  # run doesn't still spend time computing and publishing timing data for
  # work that was deliberately aborted.
  record-job-timing:
    needs: [unit-tests, component-tests, integration-tests, pact-consumer-catalog, pact-consumer-frontend, pact-provider-verify, e2e-smoke, e2e-regression]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: scripts/metrics/package-lock.json

      - name: Install metrics dependencies
        working-directory: scripts/metrics
        run: npm ci

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Push job timing
        working-directory: scripts/metrics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node push-job-timing.mjs

  # Stage 7 — regenerates the 6-page quality dashboard from whatever's now
  # in Azure Table Storage (including this run's own just-pushed rows).
  # Runs after timing collection, not in parallel with it, since the
  # dashboard's own job-timing view reads what record-job-timing just
  # wrote. !cancelled() for the same reason as above — a cancelled run
  # should not publish a dashboard update.
  publish-dashboard:
    needs: record-job-timing
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: scripts/metrics/package-lock.json

      - name: Install metrics dependencies
        working-directory: scripts/metrics
        run: npm ci

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Generate dashboard
        working-directory: scripts/metrics
        run: node generate-dashboard.mjs

      # With skip_app_build:true the action doesn't apply output_location as
      # a subfolder of app_location the way it does after a real build step —
      # it just looks for index.html directly in app_location.
      - name: Deploy dashboard
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_DASHBOARD }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: 'upload'
          app_location: 'scripts/metrics/dist'
          skip_app_build: true
