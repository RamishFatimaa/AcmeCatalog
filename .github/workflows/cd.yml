name: CD

on:
  push:
    branches: [stage]

permissions:
  id-token: write
  contents: read

env:
  AZURE_WEBAPP_NAME: acmecatalog-web

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore AcmeCatalog.slnx

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: src/AcmeCatalog.Web/clientapp/package-lock.json

      # dotnet publish triggers a BuildClientApp MSBuild target (see the .csproj)
      # that runs npm ci/build for clientapp/ before packaging — Node has to be
      # on the runner for that to succeed.
      - name: Publish Web project
        run: >
          dotnet publish src/AcmeCatalog.Web/AcmeCatalog.Web.csproj
          --configuration Release
          --output ./publish

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: ./publish
