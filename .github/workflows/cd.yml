name: CD

# Paused, not fixed-in-place: this used to publish AcmeCatalog.Web (the
# monolith) to the single "acmecatalog-web" App Service. That project no
# longer exists after this session's split into identity-service and
# catalog-service, so there's nothing left for the old steps to build.
#
# The plan for this workflow's replacement is two independent deploys, one
# per service, each to its own Azure Container Apps instance (see the
# architecture plan) — but that means provisioning new Azure infrastructure
# (a Container Apps Environment + a registry), which has real cost
# implications beyond the single free/cheap App Service that already exists.
# That's a decision to make explicitly, not something to do silently as a
# side effect of a code split. Trigger is workflow_dispatch-only for now so
# pushing to stage doesn't fire a deploy that can only fail.

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  placeholder:
    runs-on: ubuntu-latest
    steps:
      - name: Explain current state
        run: |
          echo "CD is paused pending the Container Apps infrastructure decision for identity-service and catalog-service."
          echo "See the comment at the top of this workflow file."
