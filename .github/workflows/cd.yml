name: CD

on:
  push:
    branches: [stage]

permissions:
  id-token: write
  contents: read

env:
  AZURE_WEBAPP_NAME: acmecatalog-web

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore AcmeCatalog.slnx

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: src/AcmeCatalog.Web/clientapp/package-lock.json

      # Has to happen as its own step, before `dotnet publish` runs — not as an
      # MSBuild target inside the .csproj. MSBuild evaluates wwwroot's static
      # web assets glob once, before any target executes, so a build triggered
      # mid-publish (however it's hooked in) never makes it into the
      # *.staticwebassets.endpoints.json manifest that MapStaticAssets() reads
      # at runtime — confirmed against a real Azure deploy: the page loaded,
      # but every asset routed through MapStaticAssets() 404'd. Building here
      # guarantees the files exist on disk before dotnet publish ever starts.
      - name: Build React app
        run: npm ci && npm run build
        working-directory: src/AcmeCatalog.Web/clientapp

      - name: Publish Web project
        run: >
          dotnet publish src/AcmeCatalog.Web/AcmeCatalog.Web.csproj
          --configuration Release
          --output ./publish

      # Kudu's zipdeploy does a clean atomic extract of a zip archive; pointing
      # azure/webapps-deploy at a raw folder instead makes it fall back to an
      # incremental folder sync, which is worth avoiding on general
      # reliability grounds even though it wasn't the actual cause of the
      # clientapp-dist bug above (that was the MSBuild timing issue).
      - name: Zip publish output
        run: (cd publish && zip -r ../publish.zip . -x '*.pdb')

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: ./publish.zip
