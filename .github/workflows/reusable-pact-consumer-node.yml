name: Reusable — Pact consumer (Node/Vitest)

# Same shape as reusable-pact-consumer-dotnet.yml, separate file because
# the toolchain genuinely differs (npm/vitest vs dotnet test) — one caller
# today (pact-consumer-frontend), factored out for the same future-reuse
# reason.

on:
  workflow_call:
    inputs:
      pacticipant:
        required: true
        type: string
        description: 'This consumer''s real Pacticipant name in PactFlow, e.g. frontend'
      provider:
        required: true
        type: string
        description: 'The provider Pacticipant name, e.g. identity-service'
      pact-file-path:
        required: true
        type: string
        description: 'Path to the pact JSON PactJS writes, e.g. pacts/frontend-identity-service.json'
      version-sha:
        required: true
        type: string
        description: 'Real commit SHA to publish under — the PR head SHA on a pull_request event, github.sha otherwise'
      branch-name:
        required: true
        type: string
        description: 'Real branch name to record — the PR head ref on a pull_request event, github.ref_name otherwise'
      metrics-job-name:
        required: true
        type: string
    secrets:
      PACT_BROKER_BASE_URL:
        required: true
      PACT_BROKER_TOKEN:
        required: true
      AZURE_CLIENT_ID:
        required: true
      AZURE_TENANT_ID:
        required: true
      AZURE_SUBSCRIPTION_ID:
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run consumer Pact test
        working-directory: frontend
        run: npx vitest run --reporter=json --outputFile=vitest-report.json

      - name: Publish pact to PactFlow
        env:
          PACT_BROKER_BASE_URL: ${{ secrets.PACT_BROKER_BASE_URL }}
          PACT_BROKER_TOKEN: ${{ secrets.PACT_BROKER_TOKEN }}
        run: |
          curl -sf -o /dev/null -w "published: HTTP %{http_code}\n" \
            -X PUT "$PACT_BROKER_BASE_URL/pacts/provider/${{ inputs.provider }}/consumer/${{ inputs.pacticipant }}/version/${{ inputs.version-sha }}" \
            -H "Authorization: Bearer $PACT_BROKER_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @${{ inputs.pact-file-path }}

      - name: Record consumer version's branch
        env:
          PACT_BROKER_BASE_URL: ${{ secrets.PACT_BROKER_BASE_URL }}
          PACT_BROKER_TOKEN: ${{ secrets.PACT_BROKER_TOKEN }}
        run: |
          curl -sf -o /dev/null -w "branch recorded: HTTP %{http_code}\n" \
            -X PUT "$PACT_BROKER_BASE_URL/pacticipants/${{ inputs.pacticipant }}/branches/${{ inputs.branch-name }}/versions/${{ inputs.version-sha }}" \
            -H "Authorization: Bearer $PACT_BROKER_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{}'

      - name: Publish test metrics
        if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: ./.github/actions/publish-test-metrics
        with:
          mode: vitest
          results-path: ../../frontend/vitest-report.json
          job-name: ${{ inputs.metrics-job-name }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
