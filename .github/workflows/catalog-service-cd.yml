name: Catalog Service CD

# Triggers after CI finishes (not independently on push) so the
# can-i-deploy gate below always checks THIS commit's real, freshly-
# published Pact verification results — not whatever the broker happened
# to have from an earlier push, still catching up in parallel. The real
# tradeoff: deploys now start only once the full CI pipeline (~4 min)
# completes, not immediately. workflow_run has no `paths:` filter (unlike
# the old push trigger), so path-scoping — deploy only when this service's
# own files changed — is done by hand in check-changed below instead.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [stage]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  packages: write

env:
  CONTAINER_APP_NAME: catalog-service
  RESOURCE_GROUP: acmecatalog-rg

jobs:
  check-changed:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      # workflow_run's own github.sha is the default branch's CURRENT tip
      # at trigger time, not the commit CI actually ran against — a real,
      # well-known gotcha. head_sha is the correct one; workflow_dispatch
      # has no workflow_run context at all, so it falls back to github.sha,
      # which IS correct for that event.
      - name: Resolve commit under test
        id: sha
        run: echo "sha=${{ github.event.workflow_run.head_sha || github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.sha.outputs.sha }}
          fetch-depth: 2

      - name: Check whether catalog-service changed
        id: diff
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only HEAD^ HEAD | grep -qE '^(services/catalog-service/|\.github/workflows/catalog-service-cd\.yml)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  can-i-deploy:
    needs: check-changed
    if: needs.check-changed.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # catalog-service is the Pact CONSUMER of identity-service — before
      # deploying it, the real question is whether ITS pact still holds
      # against identity-service's latest verified stage-branch version.
      # See scripts/pact/can-i-deploy.mjs for why this only gates on CDCT
      # (classic consumer-driven) results, not the BDCT (OpenAPI
      # bidirectional) ones.
      - name: Check Pact contract before deploying
        env:
          PACT_BROKER_BASE_URL: ${{ secrets.PACT_BROKER_BASE_URL }}
          PACT_BROKER_TOKEN: ${{ secrets.PACT_BROKER_TOKEN }}
          CID_PACTICIPANT: catalog-service
          CID_VERSION: ${{ needs.check-changed.outputs.sha }}
          CID_BRANCH: stage
          CID_DEPENDENCIES: identity-service
        run: node scripts/pact/can-i-deploy.mjs

  deploy:
    needs: [check-changed, can-i-deploy]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.check-changed.outputs.sha }}

      - name: Compute lowercase image name
        run: echo "IMAGE_NAME=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/acmecatalog-catalog-service" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: services/catalog-service
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ needs.check-changed.outputs.sha }}
            ${{ env.IMAGE_NAME }}:latest

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy new image to Container App
        run: |
          az containerapp update \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.IMAGE_NAME }}:${{ needs.check-changed.outputs.sha }}
