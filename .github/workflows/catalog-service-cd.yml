name: Catalog Service CD

# Independent of identity-service's deploy — only fires when this
# service's own files change, which is the actual point of splitting the
# monolith: these two now version and ship on their own schedules.
#
# can-i-deploy below races ci.yml's own Pact verification (both trigger
# off this same push, independently and in parallel) rather than waiting
# for it — waiting would need workflow_run, which only registers from the
# repo's default branch (main), and main is 35 commits behind stage and
# doesn't even have the Pact jobs. Accepted tradeoff, not an oversight:
# can-i-deploy.mjs polls for up to ~100s, which comfortably covers ci.yml's
# real Pact job timings (seconds, not minutes) in practice.
on:
  push:
    branches: [stage]
    paths:
      - 'services/catalog-service/**'
      - '.github/workflows/catalog-service-cd.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  packages: write

env:
  CONTAINER_APP_NAME: catalog-service
  RESOURCE_GROUP: acmecatalog-rg

jobs:
  can-i-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # catalog-service is the Pact CONSUMER of identity-service — before
      # deploying it, the real question is whether ITS pact still holds
      # against identity-service's latest verified stage-branch version.
      # See scripts/pact/can-i-deploy.mjs for why this only gates on CDCT
      # (classic consumer-driven) results, not the BDCT (OpenAPI
      # bidirectional) ones.
      - name: Check Pact contract before deploying
        env:
          PACT_BROKER_BASE_URL: ${{ secrets.PACT_BROKER_BASE_URL }}
          PACT_BROKER_TOKEN: ${{ secrets.PACT_BROKER_TOKEN }}
          CID_PACTICIPANT: catalog-service
          CID_VERSION: ${{ github.sha }}
          CID_BRANCH: stage
          CID_DEPENDENCIES: identity-service
        run: node scripts/pact/can-i-deploy.mjs

  deploy:
    needs: can-i-deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute lowercase image name
        run: echo "IMAGE_NAME=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/acmecatalog-catalog-service" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: services/catalog-service
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy new image to Container App
        run: |
          az containerapp update \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.IMAGE_NAME }}:${{ github.sha }}
